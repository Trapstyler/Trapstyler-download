        }

        .icon-box svg {
            width: 50px;
            height: 50px;
            fill: var(--accent-purple);

        h1 {

            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 30px;
            border: 1px solid rgba(176, 0, 255, 0.3);
        }

        .download-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: var(--accent-purple);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .download-btn:hover {
            background: #c233ff;
            box-shadow: 0 6px 25px rgba(176, 0, 255, 0.6);
            transform: translateY(-2px);
        }

        .download-btn:active {

        .download-btn svg {

            fill: #ffffff;
